# Configuración de test con H2 en memoria
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Desactivar scheduling en tests
spring.task.scheduling.enabled=false

# IA mock (sin conectar a Ollama)
ai.ollama.url=http://localhost:9999
ai.ollama.model=llama3
ai.whisper.url=http://localhost:9999
ai.whisper.api-key=
ai.embeddings.url=http://localhost:9999
ai.embeddings.api-key=

# Encriptación
encryption.master-key=testkey256bitchangemeinprod!!

# WhatsApp
whatsapp.verify-token=test_verify_token

# Debounce rápido para tests
chat.debounce.window-ms=100
chat.typing.enabled=false
