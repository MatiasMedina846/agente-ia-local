spring.application.name=agente-ia-local
server.port=8080

# Conexión a la BD en Docker (variables de entorno con fallback local)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/agente_ia_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:rootpassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate (crea las tablas automáticamente)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Servicio de IA (Ollama)
ai.ollama.url=${AI_OLLAMA_URL:http://localhost:11434}
ai.ollama.model=${AI_OLLAMA_MODEL:llama3}

# Encriptación de credenciales (HU-06)
encryption.master-key=${ENCRYPTION_MASTER_KEY:agenteia256bitkeychangemeinprod!}

# Almacenamiento de archivos (audio, imágenes)
app.storage.path=${STORAGE_PATH:./storage}

# Whisper API (HU-01)
ai.whisper.url=${WHISPER_URL:https://api.openai.com/v1/audio/transcriptions}
ai.whisper.api-key=${WHISPER_API_KEY:}
ai.whisper.model=whisper-1

# OpenAI Embeddings (HU-04 RAG)
ai.embeddings.url=${EMBEDDINGS_URL:https://api.openai.com/v1/embeddings}
ai.embeddings.api-key=${EMBEDDINGS_API_KEY:}
ai.embeddings.model=text-embedding-3-small}

# WhatsApp Business API (HU-06, HU-09, HU-10, HU-11)
whatsapp.api.version=v21.0
whatsapp.verify-token=${WHATSAPP_VERIFY_TOKEN:agenteia_verify_token}

# Debounce de mensajes (HU-02)
chat.debounce.window-ms=${DEBOUNCE_WINDOW_MS:3500}

# Simulación de tipeo (HU-10)
chat.typing.words-per-second=${TYPING_WPS:8}
chat.typing.max-delay-seconds=${TYPING_MAX_DELAY:6}
chat.typing.enabled=${TYPING_ENABLED:true}

# Reporte semanal (HU-09)
report.cron=0 0 8 * * MON
report.timezone=America/Argentina/Buenos_Aires

# Actuator
management.endpoints.web.exposure.include=health,info
