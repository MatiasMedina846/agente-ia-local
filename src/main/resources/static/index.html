<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agente IA - Chat</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div class="app">
    <header class="app-header">
        <div class="header-title">
            <span class="avatar">IA</span>
            <div>
                <h1>Agente IA</h1>
                <span class="status">En línea</span>
            </div>
        </div>
    </header>

    <main id="messages" class="messages"></main>

    <div id="typing" class="typing" hidden>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
    </div>

    <footer class="composer">
        <input id="input" type="text" placeholder="Escribe tu mensaje..." autocomplete="off" maxlength="2000">
        <button id="send" type="button">Enviar</button>
    </footer>
</div>

<script src="/js/app.js"></script>
</body>
</html>
