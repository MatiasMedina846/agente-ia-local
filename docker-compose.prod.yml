# Uso en el VPS:
#   1) Crear .env a partir de .env.example y definir DOMAIN y credenciales.
#   2) Levantar SOLO nginx + certbot primero:
#        docker compose -f docker-compose.prod.yml up -d nginx certbot
#   3) Emitir el certificado inicial (primera vez):
#        docker compose -f docker-compose.prod.yml run --rm certbot certonly --webroot \
#          -w /var/www/certbot -d ${DOMAIN} -d www.${DOMAIN} --email tu@email.com \
#          --agree-tos --no-eff-email
#   4) Levantar todo el stack:
#        docker compose -f docker-compose.prod.yml up -d
#   El contenedor certbot renueva automáticamente los certificados cada 12 horas.

services:
  postgres-db:
    image: postgres:15-alpine
    container_name: postgres_agente_ia
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-agente_ia_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rootpassword}
    volumes:
      - postgres_agente_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: agente_ia_app
    restart: unless-stopped
    depends_on:
      - postgres-db
    environment:
      DB_URL: jdbc:postgresql://postgres-db:5432/${DB_NAME:-agente_ia_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-rootpassword}
      AI_OLLAMA_URL: ${AI_OLLAMA_URL:-http://host.docker.internal:11434}
      AI_OLLAMA_MODEL: ${AI_OLLAMA_MODEL:-llama3.2}
    expose:
      - "8080"

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx_agente_ia
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    environment:
      DOMAIN: ${DOMAIN}

  certbot:
    image: certbot/certbot
    container_name: certbot_agente_ia
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: >
      /bin/sh -c 'trap exit TERM; while :; do
      certbot renew --webroot -w /var/www/certbot --quiet;
      sleep 12h & wait $${!}; done;'

volumes:
  postgres_agente_data:
